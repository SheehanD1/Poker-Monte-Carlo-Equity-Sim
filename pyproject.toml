[project]
name = "poker-equity"
version = "0.1.0"
description = "A high-performance Monte Carlo poker equity simulator with hand evaluation, range analysis, and decision-support tools."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sheehan Dandapat"},
]
keywords = ["poker", "equity", "monte-carlo", "simulation", "hand-evaluator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SheehanD1/Poker-Monte-Carlo-Equity-Sim"
Repository = "https://github.com/SheehanD1/Poker-Monte-Carlo-Equity-Sim"
Issues = "https://github.com/SheehanD1/Poker-Monte-Carlo-Equity-Sim/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
